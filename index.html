<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Werewolf</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>WEREWOLF</h1>
        </header>

        <!-- Lobby Screen -->
        <section id="lobby-screen" class="screen active">
            <div class="panel">
                <h2>Join a Village</h2>
                <input type="text" id="player-name" placeholder="YOUR NAME" maxlength="10">
                <input type="text" id="room-code" placeholder="ROOM CODE" maxlength="6">
                <button id="join-btn" class="btn primary">JOIN GAME</button>
            </div>
            <div id="lobby-players" class="panel hidden">
                <h3>Villagers Gathered</h3>
                <ul id="player-list"></ul>
                <p id="player-count">0/10</p>
                <button id="start-btn" class="btn danger hidden">START GAME</button>
                <p id="waiting-msg">Waiting for host to start...</p>
            </div>
            <div id="error-msg" class="error hidden"></div>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="screen hidden">
            <div class="top-bar">
                <div id="my-role" class="role-badge">ROLE: ???</div>
                <div id="phase-indicator">PHASE: LOBBY</div>
            </div>

            <div id="system-message" class="message-box">
                Welcome to the village. The night is approaching.
            </div>

            <div class="main-content">
                <div id="players-grid" class="players-grid">
                    <!-- Players will be rendered here -->
                </div>
            </div>

            <div id="action-panel" class="action-panel hidden">
                <h3 id="action-title">Select Target</h3>
                <p id="action-desc">Choose wisely.</p>
                <!-- Action target buttons will be generated here -->
                <div id="target-buttons" class="target-grid"></div>
            </div>
            
            <div id="game-over-screen" class="panel hidden">
                <h2 id="winner-text">GAME OVER</h2>
                <p id="winner-desc"></p>
                <button id="play-again-btn" class="btn primary" onclick="location.reload()">PLAY AGAIN</button>
            </div>
        </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
